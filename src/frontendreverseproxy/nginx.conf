
worker_processes auto;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;

  log_format custom '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" [!dt dt.trace_id=$dt_trace_id,dt.span_id=$dt_span_id,dt.trace_sampled=$dt_trace_sampled]';
  access_log /dev/stdout custom;

  # Upstream pools with persistent keepalive connections.
  # keepalive N = idle connections kept open per worker.
  upstream loginservice         { server loginservice:8080;          keepalive 32; }
  upstream broker-service       { server broker-service:8080;        keepalive 64; }
  upstream accountservice       { server accountservice:8080;        keepalive 32; }
  upstream pricing-service      { server pricing-service:8080;       keepalive 32; }
  upstream offerservice         { server offerservice:8080;          keepalive 32; }
  upstream engine               { server engine:8080;                keepalive 16; }
  upstream manager              { server manager:8080;               keepalive 64; }
  upstream credit-card-order-service { server credit-card-order-service:8080; keepalive 16; }
  upstream third-party-service  { server third-party-service:8080;   keepalive 16; }
  upstream feature-flag-service { server feature-flag-service:8080;  keepalive 32; }
  upstream bitcoin-payment-service { server bitcoin-payment-service:8080; keepalive 32; }
  upstream frontend             { server frontend:3000;              keepalive 32; }

  server {
    listen 80;

    if ($dt_trace_id ~ "^$") {
      set $dt_trace_id "unknown";
    }
    if ($dt_span_id ~ "^$") {
      set $dt_span_id "unknown";
    }
    if ($dt_trace_sampled ~ "^$") {
      set $dt_trace_sampled "unknown";
    }

    location /loginservice {
      rewrite /loginservice/(.*) /$1 break;
      proxy_pass http://loginservice;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarder-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /loginservice;
    }

    location /broker-service {
      rewrite /broker-service/(.*) /$1 break;
      proxy_pass http://broker-service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarder-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /broker-service;
    }

    location /accountservice/api {
      rewrite /accountservice/(.*) /$1 break;
      proxy_pass http://accountservice;
